# 版本信息说明 · v0.1.7-rc.2
#
# ── 这个文件是什么 ──────────────────────────────────────────────────
#   「基座 ↔ home 配套」的声明来源。启动器读它来判：这个基座要求 home 的
#   profile 具备哪些标记；缺了即【拒绝启动】。
#   定案见 用户笔记/部署/启动器-python重写-庙算与定案.md 的 D18 / D19。
#
# ── 文件名必须逐字节等于 ────────────────────────────────────────────
#   原始代码研究/v0.1.7-rc.2           （检出目录名）
#   当前配置.toml 里的 version 值      （当它指向这个版本时）
#   启动器启动时会断言，不符即拒绝启动。

version = "v0.1.7-rc.2"

[upstream]
# 检出 package.json 里的 "version" —— 上游权威的版本号本体
version = "0.1.7-rc.2"
# 检出 HEAD 上的 git tag —— 上游权威的 git 引用
git_tag = "dsh-v0.1.7-rc.2"
# 注意：我们的 version 值（v0.1.7-rc.2）= 上面 tag 去掉项目前缀 dsh-。
# 也就是说开头那个 v 是【我们的约定】，不是任何上游字节串。
# 启动器会读检出的 package.json 与 git tag 来校验这两行是否与磁盘相符 ——
# 「一致」是被校验的事实，不是约定的巧合。

[profile]
# 该基座的 profile 必须具备的标记：在
#   <home>/profiles/web/cordis.patch.yml
# 里【逐字】查找，一个都不能少。
# 来历：tools/merge-017-into-profile.py 把 0.1.7 的新内容并进 profile 时会写下这条。
required_markers = ["0.1.7 迁移物"]

# ─── 历史 ───────────────────────────────────────────────────────────
#
# 2026-08-21  起用 v0.1.1-rc.2（其余版本 tag 见 git tag -l 'dsh-v*'）
# 2026-09-26  切至 v0.1.7-rc.2。主力 home 转正；原 9007 / dsh-domus 退役，
#             其启动器存档为 start-web-015.sh。
# 2026-09-26  同日起 home 目录名从通用名 dsh-domus 改为【精确版本名】，
#             与 原始代码研究/<版本> 同构。理由：通用名会腐坏
#             （「新」过几天就旧了），精确名自文档化，同时留多份版本也不会混。
# 2026-09-26  【翻车记录】「首切直上现役」失败：插件禁用风暴 + 对话全空。
#             根因：只改了版本、home 没跟上 —— 0.1.7 基座去加载 0.1.5 的 profile。
#             这条教训后来变成两道门：启动器的「基座↔home 配套断言」，
#             以及本文件 [profile] 段的 required_markers。
