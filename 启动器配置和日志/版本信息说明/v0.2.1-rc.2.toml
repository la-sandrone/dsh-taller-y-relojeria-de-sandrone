# 版本信息说明 · v0.2.1-rc.2
#
# 结构与语义定义见同目录的 v0.1.7-rc.2.toml。
# 文件名必须逐字节等于 原始代码研究/v0.2.1-rc.2 与 当前配置.toml 里的 version。
#
# ✅ 2026-10-17 18:44 已切正：`当前配置.toml` 的 version 指向本文件，主实例跑在 9007。
#    home `dsh-domus-0.2.1-rc.2` 由 0.2.0 现役 home 派生（tools/stage-upgrade-home.py），
#    试跑（9011）通过后经 tools/cutover.sh 搬对话转正。

version = "v0.2.1-rc.2"

[upstream]
# 检出 package.json 里的 "version"
version = "0.2.1-rc.2"
# 检出 HEAD 上的 git tag（`git -C 原始代码研究/v0.2.1-rc.2 describe --tags` 实测）
git_tag = "dsh-v0.2.1-rc.2"

[profile]
# 该基座的 profile 必须具备的标记：在
#   <home>/profiles/web/cordis.patch.yml
# 里【逐字】查找，一个都不能少。
#
# 这次用的是**带版本号的真标记**（0.2.0 那份写的是 "0.1.7 迁移物"，它只证明
# 「≥0.1.7 代」，证不了代际 —— 0.2.0 的版本说明里自己就点了这个缺陷）。
# 标记由 tools/stage-upgrade-home.py 的调用者手工插入首行；重做 home 时要重新插。
required_markers = ["0.2.1 迁移物（staged-from-0.2.0-rc.2）"]

