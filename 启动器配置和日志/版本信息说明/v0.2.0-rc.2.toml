# 版本信息说明 · v0.2.0-rc.2
#
# 结构与语义定义见同目录的 v0.1.7-rc.2.toml。
# 文件名必须逐字节等于 原始代码研究/v0.2.0-rc.2 与 当前配置.toml 里的 version。

version = "v0.2.0-rc.2"

[upstream]
# 检出 package.json 里的 "version"
version = "0.2.0-rc.2"
# 检出 HEAD 上的 git tag
git_tag = "dsh-v0.2.0-rc.2"

[profile]
# ⚠️ 诚实说明：0.2.0 目前【能验证】的要求只有这一条，而它证明的是
#    「这个 profile ≥ 0.1.7 代」，**不是**「它是 0.2.0 代的」。
#    没有更强的标记可用，因为 0.2.0 的 home 是从 0.1.7 的 home 派生来的，
#    派生过程没有写下新标记。实测：两个 home 的 cordis.patch.yml
#    第 136 行 / 第 4119 行（迁移物段的起止）一字不差。
#    下次基座迁移时，应让迁移工具写下一个【带版本号的】新标记，
#    这里才能收紧成真正的「0.2.0 代」判据。
required_markers = ["0.1.7 迁移物"]

