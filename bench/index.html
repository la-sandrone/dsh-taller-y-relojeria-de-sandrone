<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH 长会话真实渲染基准</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:14px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;
         background:#14161a; color:#d8dee9; }
  #panel { position:sticky; top:0; z-index:10; background:#1b1f27; border-bottom:1px solid #2c333f;
           padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:13px; }
  #panel strong { color:#90cdf4; }
  select,button { background:#0f1216; color:#d8dee9; border:1px solid #374151; border-radius:4px;
                  padding:4px 8px; font-size:13px; }
  button { background:#2b6cb0; border:0; color:#fff; cursor:pointer; padding:6px 14px; }
  button:hover { background:#3182ce; } button:disabled { background:#3a4250; cursor:default; }
  #stats { padding:10px 16px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px;
           white-space:pre-wrap; color:#9ae6b4; border-bottom:1px solid #2c333f; }
  #log { padding:6px 16px; font-family:ui-monospace,monospace; font-size:12px; color:#a0aec0; }
  #feed { padding:0 20px 60px; max-width:920px; }
  .msg { border-left:3px solid #4299e1; padding:6px 0 6px 14px; margin:0 0 16px; }
  .msg.user { border-left-color:#68d391; }
  .role { font-size:11px; letter-spacing:.08em; color:#718096; margin-bottom:4px; }
  .reasoning { background:#0f1216; border:1px solid #2d3748; border-radius:5px; padding:6px 10px;
               margin-bottom:8px; font-size:12.5px; color:#8fa3bf; }
  .reasoning.collapsed { max-height:2.4em; overflow:hidden; }
  table { border-collapse:collapse; margin:10px 0; font-size:13px; }
  td,th { border:1px solid #2d3748; padding:3px 8px; }
  pre { background:#0f1216; padding:10px; border-radius:5px; overflow:auto; font-size:12.5px; }
  h1,h2,h3,h4 { margin:14px 0 6px; line-height:1.3; }
  .warn { color:#f6ad55; } .bad { color:#fc8181; } .ok { color:#9ae6b4; }
</style>
</head>
<body>
<div id="panel">
  <strong>真实会话渲染基准</strong>
  <label>reasoning
    <select id="reason">
      <option value="off">不渲染</option>
      <option value="collapsed" selected>折叠</option>
      <option value="expanded">展开</option>
    </select>
  </label>
  <label>content-visibility
    <select id="cv">
      <option value="off" selected>off</option>
      <option value="auto">auto</option>
      <option value="autosize">auto + contain-intrinsic-size</option>
    </select>
  </label>
  <label>公式 <select id="katex">
      <option value="1" selected>KaTeX 真渲染</option>
      <option value="0">不渲染（保留 $ 原文）</option>
    </select></label>
  <label>条数 <select id="limit">
      <option value="0">全部 186</option>
      <option value="30">30</option>
      <option value="60">60</option>
      <option value="120">120</option>
    </select></label>
  <button id="run">重建并测量</button>
</div>
<div id="stats">就绪…</div>
<div id="log"></div>
<div id="feed"></div>

<script src="katex/katex.min.js"></script>
<script src="data.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const FX = window.__FIXTURE__;
const fmt = (ms) => ms.toFixed(1) + ' ms';
const cls = (v, warn, bad) => v >= bad ? 'bad' : (v >= warn ? 'warn' : 'ok');

// ── 确定性占位 reasoning：只按真实字符数生成，内容与思考链无关 ──
let _s = 20261007;
const rnd = () => (_s = (_s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const RW = ['考虑','设','于是','由此','注意','这里','不等式','量级','边界','系数',
            '代入','化简','约去','换成','验证','因此','若','则','因为'];
function fakeReasoning(n) {
  if (n <= 0) return '';
  const out = [];
  let used = 0;
  while (used < n) {
    const len = 40 + Math.floor(rnd() * 120);
    const w = [];
    for (let i = 0; i < len / 3; i++) w.push(RW[Math.floor(rnd() * RW.length)]);
    const line = w.join('');
    out.push(line);
    used += line.length + 1;
  }
  return out.join('\n\n');
}

// ── 极简 Markdown → HTML，TeX 走 KaTeX（在渲染主路径上，计入成本）──
function esc(s) { return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function renderInline(s, useKatex) {
  // 先摘出 $$...$$ 与 $...$，其余按行内规则处理，最后回填
  const slots = [];
  const hold = (html) => '\x00' + (slots.push(html) - 1) + '\x00';
  let t = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) => hold(
    useKatex && window.katex
      ? katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false, output: 'htmlAndMathml' })
      : '<code>' + esc(m) + '</code>'));
  t = t.replace(/(?<!\$)\$([^$\n]{1,300}?)\$(?!\$)/g, (m, tex) => hold(
    useKatex && window.katex
      ? katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false, output: 'htmlAndMathml' })
      : '<code>' + esc(m) + '</code>'));
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\x00(\d+)\x00/g, (m, i) => slots[+i]);
  return t;
}

function renderMarkdown(src, useKatex) {
  const lines = src.split('\n');
  const out = [];
  let i = 0;
  const NOTABLE = new URLSearchParams(location.search).get('notable') === '1';
  const NOPRE = new URLSearchParams(location.search).get('nopre') === '1';
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*```/.test(ln) && !NOPRE) {                       // 代码块
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if (!NOTABLE && /^\s*\|.*\|\s*$/.test(ln) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {  // 表格
      const rows = [];
      const head = ln; i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cell = (r) => r.trim().replace(/^\||\|$/g, '').split('|')
        .map((c) => '<td>' + renderInline(c.trim(), useKatex) + '</td>').join('');
      out.push('<table><thead><tr>' + head.trim().replace(/^\||\|$/g, '').split('|')
        .map((c) => '<th>' + renderInline(c.trim(), useKatex) + '</th>').join('') +
        '</tr></thead><tbody>' + rows.map((r) => '<tr>' + cell(r) + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(ln);
    if (h) { out.push('<h' + h[1].length + '>' + renderInline(h[2], useKatex) + '</h' + h[1].length + '>'); i++; continue; }
    if (/^\s*([-*+]|\d+\.)\s+/.test(ln)) {          // 列表
      const buf = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        buf.push('<li>' + renderInline(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ''), useKatex) + '</li>'); i++;
      }
      out.push('<ul>' + buf.join('') + '</ul>'); continue;
    }
    if (!ln.trim()) { i++; continue; }              // 段落
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^\s*(```|\||#{1,6}\s|([-*+]|\d+\.)\s)/.test(lines[i])) {
      buf.push(lines[i]); i++;
    }
    if (!buf.length) { buf.push(ln); i++; }         // 保护：任何未消费的行都必须推进，否则死循环
    out.push('<p>' + renderInline(buf.join('\n'), useKatex) + '</p>');
  }
  return out.join('');
}

// ── URL 参数 ──
const Q = new URLSearchParams(location.search);
for (const k of ['reason', 'cv', 'katex', 'limit']) if (Q.has(k)) $(k).value = Q.get(k);

function build() {
  const useKatex = $('katex').value === '1';
  const reasonMode = $('reason').value;
  const cvMode = $('cv').value;
  // 排查开关：border-collapse:collapse 是已知的 layout 热点，可切换验证
  let sb = document.getElementById('sepborder');
  if (Q.get('sepborder') === '1') {
    if (!sb) { sb = document.createElement('style'); sb.id = 'sepborder'; document.head.appendChild(sb); }
    sb.textContent = 'table{border-collapse:separate;border-spacing:0}';
  } else if (sb) sb.remove();
  const limit = +$('limit').value || FX.messages.length;
  const msgs = FX.messages.slice(0, limit);
  const feed = $('feed');
  feed.replaceChildren();
  void feed.offsetHeight;

  const stats = { msgs: msgs.length, katexMs: 0, mdMs: 0 };

  // ① KaTeX 编译（单独计时：这是同步阻塞主线程的部分）
  const t0 = performance.now();
  const rendered = msgs.map((m) => renderMarkdown(m.text, useKatex));
  stats.mdMs = performance.now() - t0;

  // ② DOM 构建 + 挂载
  const frag = document.createDocumentFragment();
  msgs.forEach((m, idx) => {
    const d = document.createElement('div');
    d.className = 'msg';
    const r = document.createElement('div');
    r.className = 'role'; r.textContent = 'ASSISTANT #' + (idx + 1);
    d.appendChild(r);
    if (reasonMode !== 'off' && m.reasoningChars > 0) {
      const rw = document.createElement('div');
      rw.className = 'reasoning' + (reasonMode === 'collapsed' ? ' collapsed' : '');
      rw.textContent = fakeReasoning(m.reasoningChars);
      d.appendChild(rw);
    }
    const body = document.createElement('div');
    body.innerHTML = rendered[idx];
    d.appendChild(body);
    if (cvMode !== 'off') {
      d.style.contentVisibility = 'auto';
      if (cvMode === 'autosize') d.style.containIntrinsicSize = 'auto 600px';
    }
    frag.appendChild(d);
  });
  const t1 = performance.now();
  feed.appendChild(frag);
  stats.mountMs = performance.now() - t1;

  // ③ 强制完整 style+layout
  const t2 = performance.now();
  void feed.offsetHeight;
  stats.layoutMs = performance.now() - t2;

  let nodes = 0;
  const walk = (el) => { nodes++; for (const c of el.children) walk(c); };
  walk(feed);
  stats.nodes = nodes;
  stats.formulas = (document.querySelectorAll('.katex').length) | 0;

  const heap = performance.memory ? (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + ' MB' : '—';
  const compact = `RESULT msgs=${stats.msgs} nodes=${nodes} formulas=${stats.formulas} `
    + `md=${stats.mdMs.toFixed(1)} mount=${stats.mountMs.toFixed(1)} layout=${stats.layoutMs.toFixed(1)} `
    + `heap=${heap} reason=${reasonMode} cv=${cvMode} katex=${useKatex ? 1 : 0}`;
  document.title = compact;

  $('stats').innerHTML =
    `数据集        : ${FX.count} 条真实消息 / 正文 ${FX.totalTextChars.toLocaleString()} 字符 / `
      + `reasoning ${FX.totalReasoningChars.toLocaleString()} 字符\n` +
    `本次渲染      : ${stats.msgs} 条\n` +
    `公式数        : ${stats.formulas}\n` +
    `DOM 节点      : ${nodes.toLocaleString()}\n` +
    `Markdown+KaTeX 编译 : <span class="${cls(stats.mdMs, 400, 1500)}">${fmt(stats.mdMs)}</span>\n` +
    `DOM 构建+挂载 : <span class="${cls(stats.mountMs, 200, 800)}">${fmt(stats.mountMs)}</span>\n` +
    `首次 style+layout : <span class="${cls(stats.layoutMs, 300, 1200)}">${fmt(stats.layoutMs)}</span>\n` +
    `JS 堆         : ${heap}\n` +
    `模式          : reasoning=${reasonMode}  cv=${cvMode}  katex=${useKatex}\n` +
    `引擎          : ${navigator.userAgent}`;
  $('run').disabled = false;
  $('log').textContent = '';
}

let busy = false;
$('run').addEventListener('click', () => {
  if (busy) return;
  busy = true; $('run').disabled = true; $('stats').textContent = '渲染中…';
  requestAnimationFrame(() => { build(); busy = false; });
});
build();
</script>
</body>
</html>
